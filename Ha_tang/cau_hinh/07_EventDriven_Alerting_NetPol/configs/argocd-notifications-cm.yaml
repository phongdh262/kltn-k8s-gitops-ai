apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kltn-chatops
    student.hcmute.edu.vn/id: "24TX810013"
data:
  service.webhook.chatops-agent: |
    url: http://chatops-agent.operations.svc.cluster.local:8000/webhooks/argocd
    headers:
      - name: Content-Type
        value: application/json
      - name: X-Webhook-Secret
        value: $webhook-secret

  template.app-gitops-event: |
    webhook:
      chatops-agent:
        method: POST
        body: |
          {
            "event": "argocd_notification",
            "app": "{{.app.metadata.name}}",
            "namespace": "{{.app.spec.destination.namespace}}",
            "sync_status": "{{.app.status.sync.status}}",
            "health_status": "{{.app.status.health.status}}",
            "operation_phase": "{{.app.status.operationState.phase}}",
            "revision": "{{.app.status.sync.revision}}"
          }

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-gitops-event]

  trigger.on-out-of-sync: |
    - when: app.status.sync.status == 'OutOfSync'
      send: [app-gitops-event]

  subscriptions: |
    - recipients:
        - chatops-agent
      triggers:
        - on-sync-failed
        - on-out-of-sync

