grafana:
  envValueFrom:
    CHATOPS_WEBHOOK_SECRET:
      secretKeyRef:
        name: grafana-webhook-auth
        key: WEBHOOK_SECRET
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: ai-chatops-webhook
          receivers:
            - uid: chatops_internal_rx
              type: webhook
              disableResolveMessage: false
              settings:
                url: http://chatops-agent.operations.svc.cluster.local:8000/webhooks/grafana
                httpMethod: POST
                authorization_scheme: Bearer
                authorization_credentials: $CHATOPS_WEBHOOK_SECRET
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: ai-chatops-webhook
          group_by: ["alertname", "namespace"]
          group_wait: 10s
          group_interval: 2m
          repeat_interval: 30m

