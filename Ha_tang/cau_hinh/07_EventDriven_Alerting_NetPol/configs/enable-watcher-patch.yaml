spec:
  template:
    spec:
      containers:
        - name: agent
          image: ghcr.io/phongdh262/kltn-chatops-agent:v1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: webhook-http
          env:
            - name: ENABLE_K8S_WATCHER
              value: "true"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: WEBHOOK_SECRET

