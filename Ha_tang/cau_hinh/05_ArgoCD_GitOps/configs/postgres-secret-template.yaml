# Sao chép thành *.secret.local.yaml (Git bỏ qua), điền mật khẩu riêng rồi apply.
# Tạo namespace database trước khi apply Secret này.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
stringData:
  POSTGRES_DB: "appdb"
  POSTGRES_USER: "appuser"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
