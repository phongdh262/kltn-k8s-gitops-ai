# Sao chép thành *.secret.local.yaml (Git bỏ qua), điền mật khẩu riêng rồi apply.
# Tạo namespace monitoring trước khi apply Secret này.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "<GRAFANA_ADMIN_PASSWORD>"
