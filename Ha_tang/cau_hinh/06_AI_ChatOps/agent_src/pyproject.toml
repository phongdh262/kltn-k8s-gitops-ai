[project]
name = "kltn-chatops-agent"
version = "1.2.0"
description = "Agentic & GitOps-Native SRE ChatOps Engine for 3-Node K3s Cluster (v1.2 — HITL & GitOps Mutation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-telegram-bot>=21.7,<22.0",
    "kubernetes>=31.0.0,<32.0.0",
    "httpx>=0.27.2,<1.0.0",
    "pydantic>=2.9.2,<3.0.0",
    "ruamel.yaml>=0.18.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.8.0,<1.0.0",
    "pip-audit>=2.7.3,<3.0.0",
]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
