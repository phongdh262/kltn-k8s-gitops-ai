apiVersion: v1
kind: Namespace
metadata:
  name: operations
  labels:
    app.kubernetes.io/part-of: kltn-chatops
    student.hcmute.edu.vn/id: "24TX810013"
    student.hcmute.edu.vn/author: "Dinh-Hong-Phong"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-agent-sa
  namespace: operations
  labels:
    app.kubernetes.io/part-of: kltn-chatops
    student.hcmute.edu.vn/id: "24TX810013"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chatops-readonly-clusterrole
  labels:
    app.kubernetes.io/part-of: kltn-chatops
    student.hcmute.edu.vn/id: "24TX810013"
    student.hcmute.edu.vn/author: "Dinh-Hong-Phong"
    kltn.role/purpose: "least-privilege-sre-agent"
rules:
  # Cấp quyền đọc giám sát tài nguyên lõi cho AI Agent (Chỉ GET, LIST, WATCH)
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # QUYỀN ĐỌC SECRETS, EXEC HOẶC DELETE (CHỐNG LỘ PASSWORD POSTGRESQL)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chatops-readonly-clusterrolebinding
  labels:
    app.kubernetes.io/part-of: kltn-chatops
    student.hcmute.edu.vn/id: "24TX810013"
subjects:
  - kind: ServiceAccount
    name: chatops-agent-sa
    namespace: operations
roleRef:
  kind: ClusterRole
  name: chatops-readonly-clusterrole
  apiGroup: rbac.authorization.k8s.io
