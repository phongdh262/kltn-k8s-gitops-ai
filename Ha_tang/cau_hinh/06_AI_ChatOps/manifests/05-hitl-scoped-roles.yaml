# ==============================================================================
# Cấp quyền Ghi Tối thiểu theo Ngữ cảnh (Namespace-Scoped Least-Privilege RBAC)
# Chỉ triển khai ở Tuần 7 khi bật cơ chế Phê duyệt Con người trong Vòng lặp (HITL)
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops-demoapp-operator
  namespace: demo-app
  labels:
    app.kubernetes.io/part-of: kltn-gitops-ai
rules:
  # Chỉ cho phép Rolling Restart đúng Deployment `web-app` sau khi Admin bấm [Duyệt]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["web-app"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops-demoapp-operator-binding
  namespace: demo-app
subjects:
  - kind: ServiceAccount
    name: chatops-agent-sa
    namespace: operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatops-demoapp-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops-argocd-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kltn-gitops-ai
rules:
  # Chỉ cho phép gắn annotation Hard Refresh lên đúng Application `web-app-gitops`
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["web-app-gitops"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops-argocd-refresher-binding
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: chatops-agent-sa
    namespace: operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chatops-argocd-refresher
